[project]
name = "chakravyuh"
version = "0.1.0"
description = "Mastercard Innovation Challenge 2026 -- synthetic payment fraud generator and detector"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "pyarrow==17.0.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff==0.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
