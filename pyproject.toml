[project]
name = "chakravyuh"
version = "0.1.0"
description = "Mastercard Innovation Challenge 2026 -- synthetic payment fraud generator and detector"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.1.3",
    "pyarrow==17.0.0",
    "tzdata==2025.2",
    "pandas==2.2.3",
    "scikit-learn==1.9.0",
    "xgboost==2.1.2",
    "joblib==1.4.2",
    "matplotlib==3.9.2",
    "streamlit==1.61.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "shap==0.51.0",
    "mlflow==3.15.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "python-pptx==1.0.2",
    "ruff==0.7.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: exercises a generator at full production scale"]

[tool.ruff]
line-length = 100
target-version = "py311"
