name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check src tests
      - name: Test
        run: uv run pytest -q -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  playwright:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - run: uv python install 3.11
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          nohup uv --project .. run uvicorn web.api:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/scenarios >/dev/null; do sleep 1; done'
        working-directory: .
      - name: Run e2e smoke tests
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/next-app/playwright-report/
          retention-days: 7
