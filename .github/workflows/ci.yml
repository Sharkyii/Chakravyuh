name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q -m "not slow"

  data-validation:
    name: Data & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync
      - name: Explicit Schema Drift Check
        run: uv run pytest tests/schema/test_arrow_schemas.py
      - name: Generate Validation Batch
        run: make data SEED=42 N_CONSUMERS=250 N_MERCHANTS=25
      - name: Generate Graph Edges
        run: make graph
      - name: Validate Marginals
        run: make validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  playwright:
    runs-on: ubuntu-latest
    needs: [python, frontend, data-validation]
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - run: uv python install 3.11
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          nohup uv --project .. run uvicorn web.api:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/scenarios >/dev/null; do sleep 1; done'
        working-directory: .
      - name: Run e2e smoke tests
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/next-app/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [playwright]
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          
      - name: Deploy Backend Container (FastAPI)
        run: |
          npm ci
          if [ -n "$GOOGLE_GEMINI_API_KEY" ]; then
            echo "$GOOGLE_GEMINI_API_KEY" | npx wrangler secret put GOOGLE_GEMINI_API_KEY
          fi
          DEPLOY_OUT=$(npx wrangler deploy)
          echo "$DEPLOY_OUT"
          API_URL=$(echo "$DEPLOY_OUT" | grep -Eo 'https://[^ ]+\.workers\.dev' | head -n 1)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
        working-directory: backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}

      - name: Inject API URL into Frontend Config
        run: |
          if [ -z "$API_URL" ]; then
            echo "Failed to extract API URL from backend deployment"
            exit 1
          fi
          sed -i "s|http://localhost:8000|$API_URL|g" wrangler.jsonc
          echo "Injected API URL: $API_URL"
        working-directory: web/next-app

      - name: Deploy Frontend (Next.js via OpenNext)
        run: |
          npm ci
          npm run deploy
        working-directory: web/next-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
