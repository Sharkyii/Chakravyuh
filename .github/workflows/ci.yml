name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Test
        run: uv run pytest -q -m "not slow"

  data-validation:
    name: Data & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync
      - name: Explicit Schema Drift Check
        run: uv run pytest tests/schema/test_arrow_schemas.py
      - name: Generate Validation Batch
        run: make data SEED=42 N_CONSUMERS=250 N_MERCHANTS=25
      - name: Generate Graph Edges
        run: make graph
      - name: Validate Marginals
        run: make validate

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  playwright:
    runs-on: ubuntu-latest
    needs: [python, frontend, data-validation]
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - run: uv python install 3.11
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          nohup uv --project .. run uvicorn web.api:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:8000/api/scenarios >/dev/null; do sleep 1; done'
        working-directory: .
      - name: Run e2e smoke tests
        run: npx playwright test
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/next-app/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [playwright]
    steps:
      - uses: actions/checkout@v7
      
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.26"
      - run: uv python install 3.11
      - run: uv sync

      - name: Generate baseline dataset for playground container
        run: |
          uv run python -c "
          from pathlib import Path
          from src.generators.dataset import generate_stage1_dataset
          from src.dataset.stage2 import build_stage2_dataset
          from stage5.config.settings import STAGE5_DATA_DIR

          baseline_s1 = STAGE5_DATA_DIR / 'baseline' / 'stage1'
          baseline_s2 = STAGE5_DATA_DIR / 'baseline' / 'stage2'
          generate_stage1_dataset(seed=42, output_dir=baseline_s1, n_consumers=2000, n_merchants=100)
          build_stage2_dataset(input_dir=baseline_s1, output_dir=baseline_s2, clean=True)
          "

      - name: Generate small combined dataset for retrain container
        run: |
          uv run python -c "
          from collections import defaultdict
          import stage5.training.generate_training_data as gtd

          # Reuse the baseline just generated above -- main() detects the
          # matching cache manifest and skips regenerating it. Capped to 2
          # campaigns/family (32 scenarios total) so this stays a
          # few-second step in CI; the deployed retrain path only needs a
          # small real dataset to unblock training, not the full 1280.
          gtd.STAGE5_N_CONSUMERS = 2000
          gtd.STAGE5_N_MERCHANTS = 100
          by_family = defaultdict(list)
          for sc in gtd.ATTACK_SCENARIOS:
              by_family[sc['attack_id']].append(sc)
          gtd.ATTACK_SCENARIOS = [sc for fam in by_family.values() for sc in fam[:2]]
          gtd.main()
          "

      - name: Deploy Backend Container (FastAPI)
        run: |
          npm ci
          if [ -n "$GOOGLE_GEMINI_API_KEY" ]; then
            echo "$GOOGLE_GEMINI_API_KEY" | npx wrangler secret put GOOGLE_GEMINI_API_KEY
          fi
          DEPLOY_OUT=$(npx wrangler deploy)
          echo "$DEPLOY_OUT"
          API_URL=$(echo "$DEPLOY_OUT" | grep -Eo 'https://[^ ]+\.workers\.dev' | head -n 1)
          echo "API_URL=$API_URL" >> $GITHUB_ENV
        working-directory: backend-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}

      - name: Inject API URL into Frontend Config
        run: |
          if [ -z "$API_URL" ]; then
            echo "Failed to extract API URL from backend deployment"
            exit 1
          fi
          sed -i "s|http://localhost:8000|$API_URL|g" wrangler.jsonc
          echo "Injected API URL: $API_URL"
        working-directory: web/next-app

      - name: Deploy Frontend (Next.js via OpenNext)
        run: |
          npm ci
          npm run deploy
        working-directory: web/next-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_API_BASE_URL: ${{ env.API_URL }}
